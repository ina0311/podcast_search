# =============================================================================
# Docker Compose for Podcast Search
# 開発: docker compose up
# 本番: docker build --target prod
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Application Services
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: podcast_api
    profiles: [backend]
    depends_on:
      qdrant: { condition: service_healthy }
    environment:
      CI: "true"
      NODE_ENV: development
      # Supabase CLI で起動した PostgreSQL に接続（macOS/Windows では host.docker.internal を使用）
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      QDRANT_URL: http://qdrant:6333
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-dummy-key-for-development}
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
      target: dev
    container_name: podcast_admin_ui
    profiles: [backend]
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_URL: http://api:3000
      # Required for prisma generate during pnpm install (postinstall hook)
      # Supabase CLI で起動した PostgreSQL に接続（macOS/Windows では host.docker.internal を使用）
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    ports: ["5173:5173"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store

  # ---------------------------------------------------------------------------
  # Database Migration
  # ---------------------------------------------------------------------------
  migrate:
    image: node:20-alpine
    container_name: podcast_migrate
    profiles: [migrate]
    working_dir: /app
    # Supabase CLI で起動した PostgreSQL を使用するため、depends_on は不要
    environment:
      CI: "true"
      # Supabase CLI で起動した PostgreSQL に接続（macOS/Windows では host.docker.internal を使用）
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    command: sh -c "corepack enable && pnpm install && pnpm --filter @podcast_search/database prisma:migrate"

  # ---------------------------------------------------------------------------
  # Database Seed
  # ---------------------------------------------------------------------------
  seed:
    image: node:20-alpine
    container_name: podcast_seed
    profiles: [seed]
    working_dir: /app
    # Supabase CLI で起動した PostgreSQL を使用するため、depends_on は不要
    environment:
      CI: "true"
      # Supabase CLI で起動した PostgreSQL に接続（macOS/Windows では host.docker.internal を使用）
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm/store
    command: sh -c "corepack enable && pnpm install && pnpm turbo run build --filter=@podcast_search/database && pnpm --filter @podcast_search/database prisma:seed"

  # ---------------------------------------------------------------------------
  # Infrastructure Services
  # ---------------------------------------------------------------------------
  # PostgreSQL は Supabase CLI で起動します（supabase start）
  # 
  # 接続文字列:
  # - ローカルから直接接続: postgresql://postgres:postgres@localhost:54322/postgres
  # - docker-compose 内から接続（macOS/Windows）: postgresql://postgres:postgres@host.docker.internal:54322/postgres
  # - docker-compose 内から接続（Linux）: postgresql://postgres:postgres@172.17.0.1:54322/postgres

  qdrant:
    image: qdrant/qdrant:latest
    container_name: podcast_qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # supabase_db_data: # Supabase CLI を使用するため不要
  qdrant_data:
  node_modules:
  pnpm_store:
